[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secuchat"
version = "0.1.0b0"
description = "Messagerie multipoints sécurisée — projet DevSecOps EPITA"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "argon2-cffi>=23.1", "PyNaCl>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
