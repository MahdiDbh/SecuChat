name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Ruff (style et bonnes pratiques)
        run: ruff check .
      - name: Tests + couverture
        run: pytest --cov=secuchat --cov-report=term-missing --cov-report=xml
      - name: Bandit (analyse statique de sécurité)
        run: bandit -r src -ll
      - name: pip-audit (dépendances vulnérables)
        run: pip-audit -r requirements.txt
      - name: SBOM CycloneDX
        run: cyclonedx-py requirements requirements.txt -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            coverage.xml
            sbom.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (recherche de secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
